services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: stock-forecast-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mlflow
      MINIO_ROOT_PASSWORD: mlflow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  create-mlflow-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 mlflow mlflow-secret; do sleep 2; done &&
      mc mb --ignore-existing local/mlflow-artifacts &&
      mc anonymous set none local/mlflow-artifacts
      "

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: stock-forecast-mlflow
    depends_on:
      create-mlflow-bucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: mlflow
      AWS_SECRET_ACCESS_KEY: mlflow-secret
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination s3://mlflow-artifacts
      --serve-artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

volumes:
  minio_data:
  mlflow_data:
